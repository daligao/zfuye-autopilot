name: zfuye自动发布

on:
  schedule:
    # 全部在北京非高峰时段 20:00-05:30（UTC 12:00-21:30），避开DeepSeek双倍费用
    - cron: '0 12 * * *'   # 北京 20:00
    - cron: '30 12 * * *'  # 北京 20:30
    - cron: '0 13 * * *'   # 北京 21:00
    - cron: '30 13 * * *'  # 北京 21:30
    - cron: '0 14 * * *'   # 北京 22:00
    - cron: '30 14 * * *'  # 北京 22:30
    - cron: '0 15 * * *'   # 北京 23:00
    - cron: '30 15 * * *'  # 北京 23:30
    - cron: '0 16 * * *'   # 北京 00:00
    - cron: '30 16 * * *'  # 北京 00:30
    - cron: '0 17 * * *'   # 北京 01:00
    - cron: '30 17 * * *'  # 北京 01:30
    - cron: '0 18 * * *'   # 北京 02:00
    - cron: '30 18 * * *'  # 北京 02:30
    - cron: '0 19 * * *'   # 北京 03:00
    - cron: '30 19 * * *'  # 北京 03:30
    - cron: '0 20 * * *'   # 北京 04:00
    - cron: '30 20 * * *'  # 北京 04:30
    - cron: '0 21 * * *'   # 北京 05:00
    - cron: '30 21 * * *'  # 北京 05:30
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Publish article
        env:
          DEEPSEEK_KEY:  ${{ secrets.DEEPSEEK_KEY }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
        run: python publisher.py

      - name: Save log
        run: |
          git config user.name "daligao"
          git config user.email "daligao@users.noreply.github.com"
          git add data/log.json
          git diff --staged --quiet || git commit -m "log: 发布 $(date +%Y-%m-%d\ %H:%M)"
          git pull --rebase origin main
          git push

