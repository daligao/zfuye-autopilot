name: zfuye自动发布

on:
  schedule:
    # 每72分钟一篇，约20篇/天
    - cron: '0 0 * * *'
    - cron: '12 1 * * *'
    - cron: '24 2 * * *'
    - cron: '36 3 * * *'
    - cron: '48 4 * * *'
    - cron: '0 6 * * *'
    - cron: '12 7 * * *'
    - cron: '24 8 * * *'
    - cron: '36 9 * * *'
    - cron: '48 10 * * *'
    - cron: '0 12 * * *'
    - cron: '12 13 * * *'
    - cron: '24 14 * * *'
    - cron: '36 15 * * *'
    - cron: '48 16 * * *'
    - cron: '0 18 * * *'
    - cron: '12 19 * * *'
    - cron: '24 20 * * *'
    - cron: '36 21 * * *'
    - cron: '48 22 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Publish article
        env:
          DEEPSEEK_KEY:  ${{ secrets.DEEPSEEK_KEY }}
          WP_USER:       ${{ secrets.WP_USER }}
          WP_APP_PASS:   ${{ secrets.WP_APP_PASS }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
        run: python publisher.py

      - name: Save log
        run: |
          git config user.name "daligao"
          git config user.email "daligao@users.noreply.github.com"
          git add data/log.json
          git diff --staged --quiet || git commit -m "log: 发布 $(date +%Y-%m-%d\ %H:%M)"
          git pull --rebase origin main
          git push
